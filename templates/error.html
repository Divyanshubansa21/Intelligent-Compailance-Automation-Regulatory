{% extends "base.html" %}

{% block title %}Error - Intelligent Compliance Automation{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1>⚠️ Error</h1>
        <p class="error-message">{{ message }}</p>
        <a href="{{ url_for('dashboard') if 'user_id' in session else url_for('login') }}" class="btn btn-primary">
            ← Go Back
        </a>
    </div>
</div>
{% endblock %}
